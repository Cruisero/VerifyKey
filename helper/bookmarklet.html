<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google One 学生验证 - SheerID 一键提取书签安装</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .action-box {
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(96, 165, 250, 0.4);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      margin-bottom: 28px;
    }

    .bookmark-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      cursor: grab;
      user-select: none;
      transition: all 0.2s ease;
    }

    .bookmark-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
    }

    .bookmark-button:active {
      cursor: grabbing;
    }

    .drag-tip {
      margin-top: 14px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .step-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .step-content {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .step-content b {
      color: #f1f5f9;
    }

    .verify-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .verify-link-btn:hover {
      background: rgba(37, 99, 235, 0.15);
      border-color: rgba(96, 165, 250, 0.5);
      color: #93c5fd;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }

    .verify-link-btn .btn-icon {
      color: #60a5fa;
      display: flex;
      align-items: center;
    }

    .verify-link-btn .btn-arrow {
      color: #94a3b8;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
    }

    .verify-link-btn:hover .btn-arrow {
      color: #93c5fd;
      transform: translate(2px, -2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Google One 学生验证助手</h1>


    <div class="action-box">
      <!-- 核心书签链接 -->
      <a class="bookmark-button"
        href="javascript:(function(){try{const r=document.documentElement.innerHTML,m=r.match(/(https?:(?:\\\/|\/){2}services\.sheerid\.com(?:\\\/|\/)verify(?:\\\/|\/)[0-9a-f]{24}(?:\\\/|\/)\?[^\s&quot;'`&lt;&gt;]+)/i);if(!m){alert('❌ 未找到 SheerID 验证链接！\n\n请确认：\n1. 是否已打开 Google One 学生优惠页面？\n2. 页面是否已完全加载？');return;}let u=m[1].replace(/\\\//g,'/').replace(/\\u003d/gi,'=').replace(/\\u0026/gi,'&').replace(/\\u002f/gi,'/').replace(/[\\&quot;'\]\}]+$/g,'');if(navigator.clipboard&amp;&amp;window.isSecureContext){navigator.clipboard.writeText(u).then(()=>alert('🎉 提取成功并已复制到剪贴板！\n\n'+u)).catch(()=>prompt('✅ 提取成功！请按 Ctrl+C 复制链接：',u));}else{prompt('✅ 提取成功！请按 Ctrl+C 复制链接：',u);}}catch(e){alert('❌ 出错：'+e.message);}})();">
        <span>提取 SheerID 链接</span>
      </a>
      <div class="drag-tip">👆 按住上面按钮，直接拖到你的浏览器书签栏即可！</div>
    </div>

    <div class="steps">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-content">
          <b>添加书签</b>：如果看到上方按钮，直接<b>拖拽</b>到浏览器的书签栏。如果书签栏未显示，按 <code>Ctrl + Shift + B</code>（Mac 为
          <code>Cmd + Shift + B</code>）调出。
        </div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-content">
          <b>打开学生页面</b>：在浏览器中打开 Google One AI 学生优惠活动页面，并登录你的 Google 账号。
          <div>
            <a class="verify-link-btn" href="https://one.google.com/ai-student?plans=1%2C2&hl=en&utm_source=gemini&utm_medium=web&utm_campaign=gemini_students_landing_page&icid=advmktgsite&_gl=1*a3xr6z*_gcl_au*NDM4NTgyOTY1LjE3OTA1NTY5Njk.*_ga*MTY4NjA5NTg1OS4xNzkwNTU2OTcw*_ga_WC57KJ50ZZ*czE3OTA1NTY5NjkkbzEkZzAkdDE3OTA1NTY5NjkkajYwJGwwJGgw&g1_landing_page=75&otzr=1" target="_blank" rel="noopener noreferrer">
              <span class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </span>
              <span>前往 Google One 学生活动页</span>
              <span class="btn-arrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-content">
          <b>一键提取</b>：在学生页面上，直接<b>点击书签栏上的该书签</b>，链接就会自动提取并复制到剪贴板！
        </div>
      </div>
    </div>


  </div>
</body>

</html>
