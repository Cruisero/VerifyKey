<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT 学生认证 - SheerID 一键提取书签</title>
  <style>
    :root {
      --gpt-primary: #10a37f;
      --gpt-hover: #0e8c6d;
      --gpt-glow: rgba(16, 163, 127, 0.25);
      --bg: #0d0e12;
      --card-bg: rgba(23, 24, 28, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --card-inner: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #152220 0%, #0d0e12 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .container {
      max-width: 620px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 38px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--gpt-glow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 163, 127, 0.12);
      border: 1px solid rgba(16, 163, 127, 0.35);
      color: #34d399;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .header-center {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .action-box {
      background: rgba(13, 14, 18, 0.7);
      border: 2px dashed rgba(16, 163, 127, 0.4);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 28px;
      transition: border-color 0.2s;
    }

    .action-box:hover {
      border-color: rgba(16, 163, 127, 0.7);
    }

    .bookmark-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #10a37f, #059669);
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(16, 163, 127, 0.4);
      cursor: grab;
      user-select: none;
      transition: all 0.2s ease;
    }

    .bookmark-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(16, 163, 127, 0.55);
    }

    .bookmark-button:active {
      cursor: grabbing;
    }

    .drag-tip {
      margin-top: 14px;
      font-size: 13px;
      color: #34d399;
      font-weight: 500;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .step-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: var(--card-inner);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #10a37f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-content {
      font-size: 14px;
      line-height: 1.55;
      color: #d1d5db;
    }

    .step-content b {
      color: #ffffff;
    }

    .step-content code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: #a7f3d0;
      font-size: 12px;
      font-family: monospace;
    }

    .verify-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .verify-link-btn:hover {
      background: rgba(16, 163, 127, 0.12);
      border-color: rgba(16, 163, 127, 0.5);
      color: #34d399;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(16, 163, 127, 0.2);
    }

    .verify-link-btn .btn-icon {
      color: #10a37f;
      display: flex;
      align-items: center;
    }

    .verify-link-btn .btn-arrow {
      color: #9ca3af;
      transition: transform 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
    }

    .verify-link-btn:hover .btn-arrow {
      color: #34d399;
      transform: translate(2px, -2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-center">
      <div class="badge">🤖 ChatGPT 专属提取工具</div>
      <h1>ChatGPT 学生验证链接提取</h1>

    </div>

    <div class="action-box">
      <!-- 书签按钮，包含专为 ChatGPT 优化的提取逻辑 -->
      <a class="bookmark-button"
        href="javascript:(function(){try{const f=document.querySelector('iframe[src*=&quot;services.sheerid.com/verify&quot;]');let u=f?(f.src||f.getAttribute('src')):'';if(!u){const m=document.documentElement.innerHTML.match(/(https?:(?:\\\/|\/){2}services\.sheerid\.com(?:\\\/|\/)verify(?:\\\/|\/)[0-9a-f]{24}(?:\\\/|\/)\?[^\s&quot;'`&lt;&gt;]+)/i);if(m)u=m[1];}if(!u){alert('❌ 未找到 ChatGPT 验证表单！\n\n请确认：\n1. 是否在 chatgpt.com/students/verify 页面？\n2. 页面中的学生验证表单（表格）是否已加载出来？');return;}u=u.replace(/&amp;amp;/g,'&amp;').replace(/&amp;/g,'&amp;').replace(/\\\//g,'/').replace(/[\\&quot;'\]\}]+$/g,'');if(navigator.clipboard&amp;&amp;window.isSecureContext){navigator.clipboard.writeText(u).then(()=>alert('🎉 提取成功，已自动复制到剪贴板！\n\n可以直接粘贴到助手中使用。')).catch(()=>prompt('✅ 提取成功！请按 Ctrl+C 复制以下链接：',u));}else{prompt('✅ 提取成功！请按 Ctrl+C 复制以下链接：',u);}}catch(e){alert('❌ 出错：'+e.message);}})();">
        <span>提取GPT Sheerid链接</span>
      </a>

    </div>

    <div class="steps">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-content">
          <b>添加书签</b>：按住上方按钮<b>拖拽到书签栏</b>。如未见书签栏，按 <code>Ctrl + Shift + B</code>（Mac 按 <code>Cmd + Shift + B</code>）调出。
        </div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-content">
          <b>进入认证页</b>：打开 ChatGPT 学生验证页并登录你的账号，稍等 1-2 秒直至页面中间的<b>身份验证表单</b>渲染出来。
          <div>
            <a class="verify-link-btn" href="https://chatgpt.com/students/verify?campaign=students_2026&students_entry_id=bbb217a0-9a53-452b-ab44-bfa9c8d2d5f8&utm_medium=paid" target="_blank" rel="noopener noreferrer">
              <span class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </span>
              <span>前往 ChatGPT 学生认证页</span>
              <span class="btn-arrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-content">
          <b>点击提取</b>：直接<b>点击书签栏上的该按钮</b>，即可自动抓取干净的 SheerID 链接并复制到剪贴板！
        </div>
      </div>
    </div>
  </div>
</body>

</html>
